<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NutriPets</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="header">
    <div class="container">
      <h1 class="logo">NutriPets</h1>
      <nav>
        <ul>
          <li><a href="#">Inicio</a></li>
          <li><a href="#">Tienda</a></li>
          <li><a href="#">Contacto</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main-container">
    <section class="card">
      <h2>Iniciar Sesión</h2>
      <input type="text" placeholder="Usuario" id="login-usuario" />
      <input type="password" placeholder="Contraseña" id="login-password" />
      <button onclick="login()">Entrar</button>
    </section>

    <section class="card">
      <h2>Registrarse</h2>
      <input type="text" placeholder="Usuario" id="reg-usuario" />
      <input type="password" placeholder="Contraseña" id="reg-password" />
      <button onclick="register()">Registrar</button>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 NutriPets. Todos los derechos reservados.</p>
  </footer>

  <script src="scripts.js"></script>
</body>
</html>
