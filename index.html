<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NutriPets - Sistema Distribuido</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="header">
    <div class="container">
      <h1 class="logo">🐾 NutriPets</h1>
      <nav>
        <ul class="nav-links">
          <li><a href="#">Inicio</a></li>
          <li><a href="#">Servicios</a></li>
          <li><a href="#">Productos</a></li>
          <li><a href="#">Contacto</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main-content container">
    <!-- Login -->
    <section class="form-section">
      <h2>Login</h2>
      <form id="login-form">
        <input type="text" id="login-user" placeholder="Usuario" required />
        <input type="password" id="login-pass" placeholder="Contraseña" required />
        <button type="button" id="login-btn">Iniciar Sesión</button>
      </form>
    </section>

    <!-- Registro -->
    <section class="form-section">
      <h2>Registro</h2>
      <form id="register-form">
        <input type="text" id="register-user" placeholder="Usuario" required />
        <input type="password" id="register-pass" placeholder="Contraseña" required />
        <button type="button" id="register-btn">Registrarse</button>
      </form>
    </section>

    <!-- Roles -->
    <section class="form-section">
      <h2>Roles Disponibles</h2>
      <button type="button" id="ver-roles-btn">Ver Roles</button>
      <ul id="lista-roles"></ul>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2025 NutriPets - Todos los derechos reservados</p>
  </footer>

  <script type="module" src="js/scripts.js"></script>
</body>
</html>
