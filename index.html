<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NutriPets</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <h1>NutriPets: Plataforma distribuida</h1>

  <section>
    <h2>📝 Registro</h2>
    <input type="text" id="register-user" placeholder="Usuario" />
    <input type="email" id="register-email" placeholder="Correo" />
    <input type="password" id="register-pass" placeholder="Contraseña" />
    <button onclick="handleRegister()">Registrarse</button>
  </section>

  <section>
    <h2>🔐 Login</h2>
    <input type="email" id="login-email" placeholder="Correo" />
    <input type="password" id="login-pass" placeholder="Contraseña" />
    <button onclick="handleLogin()">Iniciar Sesión</button>
  </section>

  <section>
    <h2>📋 Roles disponibles</h2>
    <button onclick="handleVerRoles()">Ver Roles</button>
    <ul id="lista-roles"></ul>
  </section>

  <!-- VISTA REGISTRO DE MASCOTAS -->
<section id="vista-pets">
  <h2>🐾 Registrar Mascota</h2>
  <input type="text" id="pet-name" placeholder="Nombre de la mascota" />
  <input type="text" id="pet-type" placeholder="Tipo (perro, gato...)" />
  <input type="number" id="pet-age" placeholder="Edad" />
  <button onclick="handleRegisterPet()">Registrar Mascota</button>
</section>

<!-- VISTA CONSULTA MÉDICA -->
<section id="vista-medical">
  <h2>🩺 Consultar Datos Médicos</h2>
  <input type="text" id="pet-id-medical" placeholder="ID de la mascota" />
  <button onclick="handleGetMedical()">Consultar</button>
  <div id="medical-result"></div>
</section>


  <script src="js/register.js" type="module"></script>
  <script src="js/login.js" type="module"></script>
  <script src="js/roles.js" type="module"></script>
</body>
</html>
