<body>
  <header class="header">
    <div class="container">
      <h1 class="logo">🐾 NutriPets</h1>
      <nav>
        <ul class="nav-links">
          <li><a href="#" onclick="mostrarVista('landing')">Inicio</a></li>
          <li><a href="#" onclick="mostrarVista('login')">Iniciar Sesión</a></li>
          <li><a href="#" onclick="mostrarVista('register')">Registrarse</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main-content container">
    <!-- Landing -->
    <section id="landing" class="vista">
      <h2>Bienvenido a NutriPets</h2>
      <p>¡Tu asistente nutricional para mascotas! Selecciona una opción del menú para comenzar.</p>
    </section>

    <!-- Login -->
    <section id="login" class="vista" style="display: none;">
      <h2>Login</h2>
      <form id="login-form">
        <input type="text" id="login-user" placeholder="Usuario" required />
        <input type="password" id="login-pass" placeholder="Contraseña" required />
        <button type="button" id="login-btn">Iniciar Sesión</button>
      </form>
    </section>

    <!-- Registro -->
    <section id="register" class="vista" style="display: none;">
      <h2>Registro</h2>
      <form id="register-form">
        <input type="text" id="register-user" placeholder="Usuario" required />
        <input type="password" id="register-pass" placeholder="Contraseña" required />
        <button type="button" id="register-btn">Registrarse</button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2025 NutriPets - Todos los derechos reservados</p>
  </footer>

  <script src="js/scripts.js"></script>
</body>
