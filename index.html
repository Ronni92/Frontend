<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>NutriPets Frontend</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>NutriPets - Sistema Distribuido</h1>

  <div id="content">
    <!-- Aquí se renderiza cada microservicio -->
    <section id="login">
      <h2>Login</h2>
      <input type="text" id="loginUser" placeholder="Usuario">
      <input type="password" id="loginPass" placeholder="Contraseña">
      <button onclick="login()">Iniciar Sesión</button>
      <div id="loginResult"></div>
    </section>

    <section id="register">
      <h2>Registro</h2>
      <input type="text" id="regUser" placeholder="Usuario">
      <input type="password" id="regPass" placeholder="Contraseña">
      <button onclick="register()">Registrarse</button>
      <div id="registerResult"></div>
    </section>
  </div>

  <script src="js/services/login.js"></script>
  <script src="js/services/register.js"></script>
</body>
</html>
